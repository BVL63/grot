name: Build GROT for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'src/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.*'
      - 'IMG_0637.jpeg'
      - '1EC9F8D3-2C2F-4BCC-A89E-6C623087B96F.png'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out GROT
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows Portable
        run: npm run dist:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GROT-Windows-Setup
          path: release/GROT-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: GROT-Windows-Portable
          path: release/GROT-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
