name: GROT 2.0 yearly storage tests
on:
  push:
    branches:
      - 'develop/2.0'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test annual store
        run: npm test
