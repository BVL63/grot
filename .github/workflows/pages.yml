name: Publish GROT to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for repository subpath
        run: npm run build -- --base=/grot/
      - name: Include install icons and manifest
        run: cp 1EC9F8D3-2C2F-4BCC-A89E-6C623087B96F.png manifest.webmanifest dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Allow the Actions artifact index to register the upload before Pages queries it.
      # Run a new workflow instead of re-running a failed attempt, which keeps prior artifacts.
      - name: Wait for Pages artifact indexing
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
