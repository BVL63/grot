name: ГРОТ — Windows Installer + Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: read

jobs:
  windows-installer:
    name: Собрать ГРОТ Windows и Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Установить зависимости
        run: npm install --no-audit --no-fund
      - name: Собрать автономный установщик
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Собрать переносную версию на флешку
        run: npm run dist:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Сохранить переносную версию
        uses: actions/upload-artifact@v4
        with:
          name: GROT-Windows-Portable
          path: release/GROT-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: GROT-Windows-Installer
          path: release/GROT-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
