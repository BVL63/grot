name: ГРОТ — установщик Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'scripts/copy-print-vendors.mjs'
      - '.github/workflows/windows-desktop.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  windows-installer:
    name: Собрать ГРОТ для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Установить зависимости
        run: npm install --no-audit --no-fund
      - name: Собрать автономный установщик
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: GROT-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
