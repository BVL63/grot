name: GROT 2.0 checks
on:
  push:
    branches: [develop/v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test V2 modules
        run: node --test tests/*V2.test.js
      - name: Build production bundle with separate preview
        run: npm run build
      - name: Verify preview page included
        run: test -f dist/v2-preview.html
      - name: Upload standalone preview build for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grot-v2-preview-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
